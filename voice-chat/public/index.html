<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语音通话 · Claude</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>语音通话</h1>
      <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
    </header>

    <div id="settingsPanel" class="settings-panel hidden">
      <label>System Prompt(可留空)</label>
      <textarea id="systemPrompt" rows="4" placeholder="给 Claude 的角色设定,可留空"></textarea>
      <label>语音识别语言</label>
      <select id="sttLang">
        <option value="zh-CN">中文</option>
        <option value="en-US">English</option>
      </select>
      <label>朗读音色</label>
      <select id="voiceSelect"></select>
      <button id="closeSettings">完成</button>
    </div>

    <main>
      <div id="statusText" class="status">点击下方按钮开始通话</div>
      <button id="callBtn" class="call-btn idle">
        <span id="callIcon">🎙️</span>
      </button>
      <button id="interruptBtn" class="interrupt-btn hidden">打断</button>
    </main>

    <div id="transcript" class="transcript"></div>
  </div>

  <audio id="ttsPlayer" playsinline></audio>

  <script src="app.js"></script>
</body>
</html>
