<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>苏晏</title>

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="苏晏">
<meta name="theme-color" content="#16213e">

<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <button id="sessionsBtn" class="icon-btn" title="对话列表">☰</button>
      <h1 id="sessionTitle">苏晏</h1>
      <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
    </header>

    <div id="setupNotice" class="setup-notice hidden">
      还没配置 Supabase,聊天记录暂时不会保存。看设置里的说明,或者先联系开发者配置好。
    </div>

    <div id="sessionsPanel" class="side-panel hidden">
      <div class="side-panel-header">
        <span>对话列表</span>
        <button id="newSessionBtn" class="mini-btn">+ 新对话</button>
      </div>
      <div id="sessionsList" class="sessions-list"></div>
    </div>

    <div id="settingsPanel" class="settings-panel hidden">
      <label>System Prompt / 身份设定(保存在服务器,所有设备共用)</label>
      <textarea id="systemPrompt" rows="6" placeholder="给 TA 的角色设定,可留空;也可以用下面的导入按钮从文件里拼进来"></textarea>
      <button id="saveSettings" class="mini-btn">保存</button>

      <label>导入背景资料(md / txt / pdf,会追加到上面)</label>
      <input type="file" id="docUpload" accept=".md,.txt,.pdf" multiple>
      <div id="docUploadStatus" class="doc-status"></div>

      <label>语音识别语言</label>
      <select id="sttLang">
        <option value="zh-CN">中文</option>
        <option value="en-US">English</option>
      </select>
      <label>朗读音色(仅浏览器朗读模式下生效)</label>
      <select id="voiceSelect"></select>
      <button id="closeSettings">完成</button>
    </div>

    <div id="statusText" class="status"></div>

    <div id="transcript" class="transcript"></div>

    <div class="composer">
      <button id="micBtn" class="mic-btn" title="按一下说话">🎤</button>
      <input id="textInput" type="text" placeholder="输入消息,或点麦克风说话..." autocomplete="off">
      <button id="sendBtn" class="send-btn">发送</button>
    </div>
  </div>

  <audio id="ttsPlayer" playsinline></audio>

  <script src="app.js"></script>
</body>
</html>
