<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天 · Claude</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>聊天</h1>
      <button id="settingsBtn" class="icon-btn" title="设置">⚙</button>
    </header>

    <div id="settingsPanel" class="settings-panel hidden">
      <label>System Prompt(可留空)</label>
      <textarea id="systemPrompt" rows="4" placeholder="给 Claude 的角色设定,可留空"></textarea>
      <label>语音识别语言</label>
      <select id="sttLang">
        <option value="zh-CN">中文</option>
        <option value="en-US">English</option>
      </select>
      <label>朗读音色(仅浏览器朗读模式下生效)</label>
      <select id="voiceSelect"></select>
      <button id="closeSettings">完成</button>
    </div>

    <div id="statusText" class="status"></div>

    <div id="transcript" class="transcript"></div>

    <div class="composer">
      <button id="micBtn" class="mic-btn" title="按一下说话">🎤</button>
      <input id="textInput" type="text" placeholder="输入消息,或点麦克风说话..." autocomplete="off">
      <button id="sendBtn" class="send-btn">发送</button>
    </div>
  </div>

  <audio id="ttsPlayer" playsinline></audio>

  <script src="app.js"></script>
</body>
</html>
