<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>苏晏</title>

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="苏晏">
<meta name="theme-color" content="#cfe6fb">

<link rel="stylesheet" href="style.css">
</head>
<body>
  <img src="img/windchime.png" class="chime-deco" alt="" aria-hidden="true">
  <div class="app">
    <div class="views-wrap">

      <!-- ---------- Home ---------- -->
      <div id="view-home" class="view active">
        <header class="home-header">
          <div class="home-eyebrow">Our Secret Garden</div>
          <h1 class="home-title">秘密花园</h1>
          <div class="home-byline">苏晏<span class="deco-amp">&amp;</span>溪禾</div>
          <div class="home-date-row">
            <span id="homeDate" class="home-date"></span>
            <span id="homeWeather" class="home-weather hidden"></span>
          </div>
          <div class="home-divider"><span class="line"></span><span class="sym">✦</span><span class="line"></span></div>
        </header>

        <div class="home-scroll">
          <div class="card quote-card">
            <div id="quoteText" class="quote-text"></div>
            <div id="quoteZh" class="quote-text-zh"></div>
            <button id="quoteRefreshBtn" class="mini-icon-btn quote-refresh" title="换一句">⟳</button>
          </div>

          <div class="card now-card">
            <div class="now-head">
              <span id="nowEmoji" class="now-emoji"></span>
              <span class="now-label">他现在</span>
              <span id="nowActivity" class="now-activity"></span>
            </div>
            <div id="nowThought" class="now-thought"></div>
          </div>

          <div class="card song-card">
            <div class="song-card-head">
              <span class="song-label">♪ 今天想让你听</span>
              <button id="songRerollBtn" class="mini-icon-btn" title="换一首">⟳</button>
            </div>
            <div id="songBody" class="song-body">
              <div class="song-loading">正在挑歌...</div>
            </div>
          </div>

          <div class="card milestone-card">
            <div class="song-card-head">
              <span class="song-label">✦ 纪念册</span>
            </div>
            <div id="milestoneList" class="milestone-list">
              <div class="song-loading">还没有记下的事</div>
            </div>
            <div class="milestone-add-row">
              <input type="text" id="milestoneInput" class="more-text-input" placeholder="也可以自己写一条...">
              <button id="milestoneAddBtn" class="mini-btn">记下</button>
            </div>
          </div>

          <div class="card temp-card hidden" id="tempCard">
            <span class="temp-label">此刻的心情</span>
            <div class="temp-value-wrap">
              <span id="tempValue" class="temp-value">--</span>
              <span id="tempWord" class="temp-word"></span>
            </div>
          </div>

          <div class="card token-card">
            <div class="token-row">
              <span class="token-dot" style="background:#2e5a88"></span>
              <span class="token-text">蓝宝石 · 冷而方,像他一开始的样子</span>
            </div>
            <div class="token-row">
              <span class="token-dot" style="background:#e8a848"></span>
              <span class="token-text">小黄钻 · 热烈阳光,像她</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ---------- Chat ---------- -->
      <div id="view-chat" class="view">
        <header class="chat-header">
          <button id="sessionsBtn" class="icon-btn" title="对话列表">☰</button>
          <div class="chat-header-mid">
            <div class="chat-avatar">晏</div>
            <div class="chat-header-text">
              <h1 id="sessionTitle">苏 晏</h1>
              <div id="moodStatus" class="mood-status"></div>
            </div>
          </div>
          <button id="callBtn" class="icon-btn" title="语音通话">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.25a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
          </button>
        </header>

        <div id="setupNotice" class="setup-notice hidden">
          还没配置 Supabase,聊天记录暂时不会保存。看设置里的说明,或者先联系开发者配置好。
        </div>

        <div id="sessionsPanel" class="side-panel hidden">
          <div class="side-panel-header">
            <span>对话列表</span>
            <button id="newSessionBtn" class="mini-btn">+ 新对话</button>
          </div>
          <div id="sessionsList" class="sessions-list"></div>
        </div>

        <div id="statusText" class="status"></div>

        <div id="transcript" class="transcript"></div>

        <div id="composerDock" class="composer-dock">
          <div id="imagePreview" class="image-preview hidden"></div>

          <div class="composer">
            <button id="imageBtn" class="round-btn" title="发图片(可多选)">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2c3 3 5 6.2 5 9.2a5 5 0 1 1-10 0C7 8.2 9 5 12 2z"/>
                <path d="M12 13.5V22"/>
                <path d="M12 17c-2-.3-3.3-1.4-4-3"/>
                <path d="M12 19.2c2-.2 3.4-1.2 4.2-2.8"/>
              </svg>
            </button>
            <input type="file" id="imageInput" accept="image/*" multiple class="hidden">
            <input id="textInput" type="text" placeholder="输入消息..." autocomplete="off">
            <button id="sendBtn" class="send-btn">发送</button>
          </div>
        </div>
      </div>

      <!-- ---------- Diary ---------- -->
      <div id="view-diary" class="view">
        <header class="diary-header">
          <span class="icon-btn-spacer"></span>
          <div class="diary-header-text">
            <div class="diary-eyebrow">Dear Diary</div>
            <h1 class="view-title diary-title">晏晏的日记</h1>
          </div>
          <button id="diaryWriteBtn" class="icon-btn diary-write-btn" title="现在写一篇">✎</button>
        </header>
        <div id="diaryList" class="diary-list">
          <div class="diary-loading">正在翻日记...</div>
        </div>
      </div>

      <!-- ---------- More / Settings ---------- -->
      <div id="view-more" class="view">
        <header>
          <h1 class="view-title">更多</h1>
        </header>
        <div class="more-scroll">

          <div class="card more-card">
            <div class="more-row">
              <span>相识于</span>
              <input type="date" id="togetherSince" class="more-date-input">
            </div>
            <div id="togetherDays" class="together-days"></div>
          </div>

          <div class="card numbers-card">
            <div class="numbers-row">
              <span id="numberDays" class="numbers-value">--</span>
              <span class="numbers-label">在一起的天数</span>
            </div>
            <div class="numbers-row">
              <span id="numberSessions" class="numbers-value">--</span>
              <span class="numbers-label">聊过的窗口数</span>
            </div>
          </div>

          <div class="card passcode-card">
            <span class="passcode-label">暗号</span>
            <span class="passcode-text">睡醒了。你在。</span>
          </div>

          <div class="card more-card">
            <div class="more-row">
              <span>所在城市(用于天气)</span>
              <input type="text" id="weatherCity" class="more-text-input" placeholder="比如 上海">
            </div>
          </div>

          <div class="card more-card">
            <label>模型 / API 设置(留空的项用服务器默认配置)</label>
            <label>中转站接口地址(不带 /v1)</label>
            <input type="text" id="apiBaseUrl" class="more-full-input" placeholder="https://xxx.com" autocomplete="off">
            <label>API Key</label>
            <input type="password" id="apiKeyInput" class="more-full-input" placeholder="sk-..." autocomplete="off">
            <label>模型</label>
            <input type="text" id="modelInput" class="more-full-input" placeholder="比如 claude-sonnet-5" autocomplete="off">
            <select id="modelSelect" class="hidden"></select>
            <button id="fetchModelsBtn" class="mini-btn">拉取模型列表</button>
            <div id="modelStatus" class="doc-status"></div>
          </div>

          <div class="card more-card">
            <label class="switch-row">
              <span>自动写日记</span>
              <input type="checkbox" id="toggleAutoDiary">
            </label>
            <label class="switch-row">
              <span>日记里显示心情/温度</span>
              <input type="checkbox" id="toggleShowMood">
            </label>
            <label class="switch-row">
              <span>每日推荐歌曲</span>
              <input type="checkbox" id="toggleDailySong">
            </label>
            <label class="switch-row">
              <span>起床/入睡状态提示</span>
              <input type="checkbox" id="toggleSleepState">
            </label>
          </div>

          <div class="card more-card">
            <label>聊天页背景工坊</label>
            <div class="bg-slot-row">
              <button id="bgSlotDay" class="mini-btn bg-slot active">☀️ 白天版</button>
              <button id="bgSlotNight" class="mini-btn bg-slot">🌙 夜晚版</button>
            </div>
            <label>方式一:用 MiniMax 画一张(按 MiniMax 计费)</label>
            <textarea id="bgPromptInput" rows="3" placeholder="想要什么画面?留空用默认的:吉卜力风夏日庭院(白天蓝天白云/夜晚星空灯笼萤火虫)"></textarea>
            <button id="bgGenerateBtn" class="mini-btn">生成一张看看</button>
            <label>方式二:直接上传一张你自己的图</label>
            <input type="file" id="bgUploadInput" accept="image/*">
            <div id="bgPreviewWrap" class="bg-preview-wrap hidden">
              <img id="bgPreview" class="bg-preview" alt="候选背景">
              <div class="bg-preview-actions">
                <button id="bgApplyBtn" class="mini-btn">就用这张</button>
                <button id="bgResetBtn" class="mini-btn milestone-no">恢复默认背景</button>
              </div>
            </div>
            <div id="bgStatus" class="doc-status"></div>
          </div>

          <div class="card more-card">
            <label>他的形象(自动发照片时用)</label>
            <label>外貌描述(每张自动生成的照片都会带上)</label>
            <textarea id="photoAppearance" rows="3" placeholder="比如:二十六岁中国男性,黑色短发,眉眼干净,清瘦挺拔,白衬衫"></textarea>
            <label>参考照片(可选,配置后每张照片保持同一张脸)</label>
            <input type="file" id="photoRefUpload" accept="image/*">
            <div id="photoRefRow" class="photo-ref-row hidden">
              <img id="photoRefPreview" class="photo-ref-preview" alt="参考照片">
              <button id="photoRefRemove" class="mini-btn">移除参考照片</button>
            </div>
            <div id="photoRefStatus" class="doc-status"></div>
          </div>

          <div class="card more-card">
            <label>System Prompt / 身份设定(保存在服务器,所有设备共用)</label>
            <textarea id="systemPrompt" rows="6" placeholder="给 TA 的角色设定,可留空;也可以用下面的导入按钮从文件里拼进来"></textarea>

            <label>导入背景资料(md / txt / pdf,会追加到上面)</label>
            <input type="file" id="docUpload" accept=".md,.txt,.pdf" multiple>
            <div id="docUploadStatus" class="doc-status"></div>

            <label>朗读语言(浏览器朗读模式下生效)</label>
            <select id="sttLang">
              <option value="zh-CN">中文</option>
              <option value="en-US">English</option>
            </select>
            <label>朗读音色(仅浏览器朗读模式下生效)</label>
            <select id="voiceSelect"></select>

            <button id="saveSettings" class="mini-btn more-save-btn">保存</button>
          </div>

        </div>
      </div>

    </div>

    <nav class="tabbar">
      <button class="tab-btn active" data-view="home" title="主页">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg>
        <span>主页</span>
      </button>
      <button class="tab-btn" data-view="chat" title="聊天">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-4 4V5z"/></svg>
        <span>聊天</span>
      </button>
      <button class="tab-btn" data-view="diary" title="日记">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h11a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H8a2 2 0 0 1-2-2V3.5z"/><path d="M6 17.5h12"/></svg>
        <span>日记</span>
      </button>
      <button class="tab-btn" data-view="more" title="更多">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        <span>更多</span>
      </button>
    </nav>
  </div>

  <div id="callScreen" class="call-screen hidden">
    <div class="call-avatar">晏</div>
    <div class="call-name">苏 晏</div>
    <div id="callStatus" class="call-status">正在接通...</div>
    <div id="callTranscript" class="call-transcript"></div>
    <div class="call-controls">
      <button id="callTalkBtn" class="call-talk-btn" title="静音/继续">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg>
      </button>
      <button id="callEndBtn" class="call-end-btn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.25a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      </button>
    </div>
  </div>

  <audio id="ttsPlayer" playsinline></audio>

  <script src="app.js"></script>
</body>
</html>
