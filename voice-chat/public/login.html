<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>苏晏</title>
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#cfe6fb">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px;
    position: relative;
    color: #24344c;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.05) 30%, rgba(233,244,255,0.15) 75%, rgba(233,244,255,0.35) 100%),
      url('img/sky-bg.jpg');
    background-size: cover;
    background-position: center;
    filter: saturate(0.78) brightness(1.06);
  }
  .card {
    width: 100%;
    max-width: 320px;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 24px;
    padding: 28px 24px;
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 8px 30px rgba(94,142,207,0.18);
    text-align: center;
  }
  h1 {
    font-family: Georgia, "Songti SC", serif;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.2em;
    margin: 0 0 24px;
    color: #24344c;
  }
  input {
    width: 100%;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 16px;
    color: #24344c;
    text-align: center;
    letter-spacing: 0.1em;
  }
  input:focus { outline: none; }
  button {
    width: 100%;
    margin-top: 14px;
    background: #5b8fd6;
    border: none;
    color: white;
    padding: 12px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(91,143,214,0.4);
  }
  button:disabled { opacity: 0.5; }
  .error {
    min-height: 18px;
    font-size: 12.5px;
    color: #c0395a;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>苏 晏</h1>
    <input id="pw" type="password" placeholder="密码" autocomplete="current-password" inputmode="text">
    <button id="submitBtn">进入</button>
    <div id="err" class="error"></div>
  </div>
  <script>
    const pwEl = document.getElementById('pw');
    const btnEl = document.getElementById('submitBtn');
    const errEl = document.getElementById('err');

    async function submit() {
      const password = pwEl.value;
      if (!password) return;
      btnEl.disabled = true;
      errEl.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || '密码不对');
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message;
        pwEl.value = '';
        pwEl.focus();
      } finally {
        btnEl.disabled = false;
      }
    }

    btnEl.addEventListener('click', submit);
    pwEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    pwEl.focus();
  </script>
</body>
</html>
