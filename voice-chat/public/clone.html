<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>声音克隆</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #16213e;
    color: #eee;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .card {
    max-width: 420px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.hint { font-size: 13px; opacity: 0.7; margin: 0 0 8px; }
  label { font-size: 13px; opacity: 0.8; }
  input[type=text], input[type=password], input[type=file] {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: #eee;
    padding: 10px;
    font-size: 15px;
    width: 100%;
  }
  button {
    background: #4361ee;
    border: none;
    color: white;
    padding: 12px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  #result {
    white-space: pre-wrap;
    word-break: break-all;
    background: rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    min-height: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>声音克隆</h1>
    <p class="hint">上传一段 10 秒~5 分钟的音频(mp3/m4a/wav,20MB 以内),克隆成功后把返回的 voiceId 填到 Render 的环境变量 MINIMAX_VOICE_ID 里。</p>

    <label>口令(如果设置了 CLONE_PASSCODE)</label>
    <input type="password" id="passcode" placeholder="没设置就留空">

    <label>音色 ID(自己起个名字,比如 suyan-voice-01)</label>
    <input type="text" id="voiceId" placeholder="suyan-voice-01">

    <label>音频文件</label>
    <input type="file" id="audio" accept="audio/*">

    <button id="submitBtn">开始克隆</button>

    <div id="result"></div>
  </div>

  <script>
    const submitBtn = document.getElementById('submitBtn');
    const resultEl = document.getElementById('result');

    submitBtn.addEventListener('click', async () => {
      const passcode = document.getElementById('passcode').value;
      const voiceId = document.getElementById('voiceId').value.trim();
      const fileInput = document.getElementById('audio');

      if (!voiceId) { resultEl.textContent = '先填音色 ID'; return; }
      if (!fileInput.files[0]) { resultEl.textContent = '先选音频文件'; return; }

      submitBtn.disabled = true;
      resultEl.textContent = '上传克隆中,别关页面...';

      const form = new FormData();
      form.append('passcode', passcode);
      form.append('voiceId', voiceId);
      form.append('audio', fileInput.files[0]);

      try {
        const res = await fetch('/api/clone-voice', { method: 'POST', body: form });
        const json = await res.json();
        if (res.ok && json.ok) {
          resultEl.textContent = `克隆成功!\n\n把这个加到 Render 环境变量:\nMINIMAX_VOICE_ID=${json.voiceId}\n\n注意: 7 天内没被真正用于一次合成会被清理,克隆完记得去通话页面说句话用一下。`;
        } else {
          resultEl.textContent = '出错了:\n' + (json.error || JSON.stringify(json));
        }
      } catch (err) {
        resultEl.textContent = '请求失败: ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
